# Bloc nginx (HTTP seulement) : certbot y ajoutera lui-même le HTTPS et la
# redirection http -> https (voir DEPLOIEMENT.md, étape 5).
# Installation :
#   sudo cp deploy/nginx-costalats-backyard.conf /etc/nginx/sites-available/costalats-backyard
#   sudo ln -s /etc/nginx/sites-available/costalats-backyard /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name costalats-backyard.emeryk-ablonet.fr;

    # Une photo par requête ; 30 Mo couvre un original envoyé tel quel (vieux téléphone, HEIC).
    client_max_body_size 30m;

    location /static/ {
        alias /srv/costalats-backyard/staticfiles/;
        expires 1h;  # court : les fichiers CSS/JS gardent le même nom d'un déploiement à l'autre
    }

    # Photos et zip : JAMAIS accessibles directement. Django vérifie l'accès puis répond
    # « X-Accel-Redirect: /_protege/... » ; seul nginx peut alors lire ces fichiers.
    location /_protege/ {
        internal;
        alias /srv/costalats-backyard/media/;
        add_header Cache-Control "private, max-age=86400";
        add_header X-Robots-Tag "noindex";
    }

    # Bloque les robots qui cherchent .env, .git, etc. (garde l'accès certbot).
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        proxy_pass http://unix:/run/costalats-backyard/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
