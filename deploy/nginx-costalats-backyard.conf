# Bloc nginx (HTTP seulement) : certbot y ajoutera lui-même le HTTPS et la
# redirection http -> https (voir DEPLOIEMENT.md, étape 5).
# Installation :
#   sudo cp deploy/nginx-costalats-backyard.conf /etc/nginx/sites-available/costalats-backyard
#   sudo ln -s /etc/nginx/sites-available/costalats-backyard /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name costalats-backyard.emeryk-ablonet.fr;

    client_max_body_size 1m;

    location /static/ {
        alias /srv/costalats-backyard/staticfiles/;
        expires 1h;  # court : les fichiers CSS/JS gardent le même nom d'un déploiement à l'autre
    }

    location / {
        proxy_pass http://unix:/run/costalats-backyard/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
